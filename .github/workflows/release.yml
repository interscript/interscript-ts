name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # onnxruntime-node's postinstall downloads binaries that are
      # unnecessary for packaging; skip scripts in the release job
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Set version from workflow input (patch release)
        if: github.event_name == 'workflow_dispatch'
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$current" != "${{ inputs.version }}" ]; then
            npm version ${{ inputs.version }} --no-git-tag-version
          fi
      # The npm tarball is attested before publish so its provenance
      # describes exactly the bytes npm ships (npm --provenance below
      # additionally provides the registry-side provenance link).
      - run: npm pack
      - name: Attest build provenance (npm tarball)
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: interscript-*.tgz
      - run: npm publish --access public --provenance

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      # Org supply-chain layer (SOTA-2027): attach the CycloneDX JSON SBOM
      # + sha256 sidecar (house sidecar pattern) to the release.
      # npm's built-in SBOM emitter over the reified tree (npm ci first,
      # same as the publish job). Emits schema 1.5 (npm's native).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Emit CycloneDX SBOM (npm sbom)
        id: sbom
        run: |
          npm ci --ignore-scripts
          version=${tag#v}
          npm sbom --sbom-format cyclonedx --sbom-type application \
            > "interscript-${version}.cdx.json"
          sha256sum "interscript-${version}.cdx.json" \
            > "interscript-${version}.cdx.json.sha256"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          ls -la "interscript-${version}.cdx.json"*
        env:
          tag: ${{ steps.version.outputs.tag }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            interscript-${{ steps.sbom.outputs.version }}.cdx.json
            interscript-${{ steps.sbom.outputs.version }}.cdx.json.sha256
